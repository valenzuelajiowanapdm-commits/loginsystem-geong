<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #4c1d95, #7c3aed);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
 
      .container {
        background: #ffffff;
        padding: 40px 30px;
        width: 320px;
        text-align: center;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(76, 29, 149, 0.35);
      }
 
      h1 {
        color: #4c1d95;
        font-weight: 700;
        font-size: 22px;
        margin-bottom: 10px;
      }
 
      p {
        color: #6b7280;
        font-size: 14px;
        margin-bottom: 20px;
      }
 
      button {
        width: 100%;
        padding: 12px;
        cursor: pointer;
        background: #7c3aed;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        font-size: 14px;
        transition: background 0.15s ease;
      }
 
      button:hover {
        background: #6d28d9;
      }
 
      button:active {
        background: #5b21b6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Welcome to the Dashboard</h1>
 
      <p>You have successfully logged in.</p>
 
      <button onclick="logout()">Logout</button>
    </div>
 
    <script>
      function logout() {
        localStorage.removeItem("token");
        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
